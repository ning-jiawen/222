name: build-cheat

on:
  push:
    branches: [main]
    paths: ["theos_cheat/**", ".github/workflows/build-cheat.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 装 ldid
        run: |
          brew install ldid
          ldid -h | head -3
          
      - name: 装 Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          curl -L -o $RUNNER_TEMP/sdks.tar.xz https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz || true
          mkdir -p $THEOS/sdks && tar -xf $RUNNER_TEMP/sdks.tar.xz -C $THEOS/sdks 2>/dev/null || true
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: 拉 imgui 源码
        run: |
          cd theos_cheat
          if [ ! -d imgui ]; then
            git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git imgui
          fi

      - name: 编译
        run: |
          cd theos_cheat
          make package DEBUG=0 FINALPACKAGE=1
          find .theos -name "*.dylib" -exec cp {} "$RUNNER_TEMP/" \;

      - uses: actions/upload-artifact@v4
        with:
          name: cheat-dylib
          path: |
            ${{ runner.temp }}/*.dylib
            theos_cheat/*.deb
