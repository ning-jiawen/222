name: build-cheat

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: 装 ldid
        run: |
          brew install ldid
          ldid -h | head -3

      - name: 装 Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$THEOS/makefiles" >> $GITHUB_ENV

      - name: 装 SDK
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -fL -o sdk.tar.xz https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf sdk.tar.xz
          ls -d *.sdk

      - name: 拉 imgui
        run: |
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git theos_cheat/imgui
          ls theos_cheat/imgui | head -10

      - name: 编译
        run: |
          cd theos_cheat
          make DEBUG=0 FINALPACKAGE=1 V=1

      - name: 收集产物
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          find theos_cheat/.theos -name "*.dylib" -type f -exec cp {} "$RUNNER_TEMP/out/" \;
          echo "=== 找到的 dylib ==="
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheat-dylib
          path: ${{ runner.temp }}/out/*
